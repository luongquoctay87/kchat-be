spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.kchat: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    probes:
      enabled: true

# No bundled defaults — missing env fails startup.
kchat:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
  bot:
    ops-alerts-secret: ${KCHAT_OPS_ALERTS_WEBHOOK_SECRET}
  s3:
    bucket: ${KCHAT_S3_BUCKET}
    region: ${KCHAT_S3_REGION:ap-southeast-1}
    endpoint: ${KCHAT_S3_ENDPOINT:}
    access-key: ${KCHAT_S3_ACCESS_KEY:}
    secret-key: ${KCHAT_S3_SECRET_KEY:}
  webrtc:
    allow-dev-openrelay: false
  password-reset:
    mail-enabled: ${KCHAT_PASSWORD_RESET_MAIL_ENABLED:true}
